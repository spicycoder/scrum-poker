name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Update Aspire workload
        run: dotnet workload install aspire

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ./ScrumPoker.slnx

      - name: Build
        run: dotnet build --no-restore -c Release ./ScrumPoker.slnx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Configure pnpm
        run: pnpm config set minimumReleaseAge 0 --location=project
        working-directory: web

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: web

      - name: Build frontend
        run: pnpm run build
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Lint frontend
        run: pnpm run lint
        working-directory: web

      - name: Test with coverage
        run: |
          dotnet dotnet-coverage collect \
            --settings ./coverage.runsettings \
            --output ./.coverage/coverage.cobertura.xml \
            --output-format cobertura \
            "dotnet test --no-build -c Release ./ScrumPoker.slnx --logger trx --results-directory ./.coverage/trx"

      - name: Test report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: Test results
          path: ./.coverage/trx/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Update test badges
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          UNIT=$(find tests -path '*UnitTests*' -name '*.cs' ! -path '*/obj/*' | xargs grep -c '\[Fact\]\|\[Theory\]' | cut -d: -f2 | paste -sd+ | bc)
          INT=$(find tests -path '*IntegrationTests*' -name '*.cs' ! -path '*/obj/*' | xargs grep -c '\[Fact\]\|\[Theory\]' | cut -d: -f2 | paste -sd+ | bc)

          if [ -f ./.coverage/coverage.cobertura.xml ]; then
            RATE=$(head -5 ./.coverage/coverage.cobertura.xml | grep -oP 'line-rate="\K[^"]+' | head -1)
            PCT=$(echo "$RATE * 100" | bc | sed 's/\..*//')
            echo "{\"schemaVersion\":1,\"label\":\"Coverage\",\"message\":\"${PCT}%\",\"color\":\"blue\"}" > coverage.json
          else
            echo '{"schemaVersion":1,"label":"coverage","message":"N/A","color":"lightgrey"}' > coverage.json
          fi

          echo "{\"schemaVersion\":1,\"label\":\"Unit Tests\",\"message\":\"${UNIT}\",\"color\":\"blueviolet\"}" > unit.json
          echo "{\"schemaVersion\":1,\"label\":\"Int Tests\",\"message\":\"${INT}\",\"color\":\"orange\"}" > integration.json
          gh api -X PATCH /gists/eca658a13dc5df0c2abb154ae9aeb820 \
            -f "files[coverage.json][content]=$(cat coverage.json)" \
            -f "files[unit.json][content]=$(cat unit.json)" \
            -f "files[integration.json][content]=$(cat integration.json)"

  publish:
    name: Publish containers
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        run: |
          dotnet publish src/ScrumPoker.API \
            /t:PublishContainer \
            -c Release \
            -p ContainerImageName=ghcr.io/spicycoder/scrumpoker-api \
            -p ContainerImageTag=${{ github.sha }} \
            -p ContainerRuntimeIdentifier=linux-x64

      - name: Tag and push API image
        run: |
          docker tag ghcr.io/spicycoder/scrumpoker-api:${{ github.sha }} ghcr.io/spicycoder/scrumpoker-api:${{ github.ref_name }}
          docker push ghcr.io/spicycoder/scrumpoker-api:${{ github.sha }}
          docker push ghcr.io/spicycoder/scrumpoker-api:${{ github.ref_name }}
          if [ '${{ github.ref_name }}' = 'main' ]; then
            docker tag ghcr.io/spicycoder/scrumpoker-api:${{ github.sha }} ghcr.io/spicycoder/scrumpoker-api:latest
            docker push ghcr.io/spicycoder/scrumpoker-api:latest
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/spicycoder/scrumpoker-web:${{ github.sha }}
            ghcr.io/spicycoder/scrumpoker-web:${{ github.ref_name }}
            ${{ github.ref_name == 'main' && 'ghcr.io/spicycoder/scrumpoker-web:latest' || '' }}

  deploy-frontend:
    name: Deploy frontend to gh-pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'

      - name: Setup Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        if: steps.filter.outputs.frontend == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: pnpm install
        working-directory: web

      - name: Build frontend
        if: steps.filter.outputs.frontend == 'true'
        run: pnpm run build
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLARITY_ID: ${{ vars.VITE_CLARITY_ID }}

      - name: Deploy to gh-pages
        if: steps.filter.outputs.frontend == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
