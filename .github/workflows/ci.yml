name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ./ScrumPoker.slnx

      - name: Build
        run: dotnet build --no-restore -c Release ./ScrumPoker.slnx

      - name: Test with coverage
        run: |
          dotnet dotnet-coverage collect \
            --settings ./coverage.runsettings \
            --output ./.coverage/coverage.cobertura.xml \
            --output-format cobertura \
            "dotnet test --no-build -c Release ./ScrumPoker.slnx"

      - name: Update test badges
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Count tests from source
          UNIT=$(find tests -path '*UnitTests*' -name '*.cs' ! -path '*/obj/*' | xargs grep -c '\[Fact\]\|\[Theory\]' | cut -d: -f2 | paste -sd+ | bc)
          INT=$(find tests -path '*IntegrationTests*' -name '*.cs' ! -path '*/obj/*' | xargs grep -c '\[Fact\]\|\[Theory\]' | cut -d: -f2 | paste -sd+ | bc)

          # Parse coverage (skip if file missing)
          if [ -f ./.coverage/coverage.cobertura.xml ]; then
            RATE=$(head -5 ./.coverage/coverage.cobertura.xml | grep -oP 'line-rate="\K[^"]+' | head -1)
            PCT=$(echo "$RATE * 100" | bc | sed 's/\..*//')
            echo "{\"schemaVersion\":1,\"label\":\"Coverage\",\"message\":\"${PCT}%\",\"color\":\"blue\"}" > coverage.json
          else
            echo '{"schemaVersion":1,"label":"coverage","message":"N/A","color":"lightgrey"}' > coverage.json
          fi

          # Update gist
          echo "{\"schemaVersion\":1,\"label\":\"Unit Tests\",\"message\":\"${UNIT}\",\"color\":\"blueviolet\"}" > unit.json
          echo "{\"schemaVersion\":1,\"label\":\"Int Tests\",\"message\":\"${INT}\",\"color\":\"orange\"}" > integration.json
          gh api -X PATCH /gists/eca658a13dc5df0c2abb154ae9aeb820 \
            -f "files[coverage.json][content]=$(cat coverage.json)" \
            -f "files[unit.json][content]=$(cat unit.json)" \
            -f "files[integration.json][content]=$(cat integration.json)"
