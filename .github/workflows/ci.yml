name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ./ScrumPoker.slnx

      - name: Build
        run: dotnet build --no-restore -c Release ./ScrumPoker.slnx

      - name: Test with coverage
        run: |
          dotnet dotnet-coverage collect \
            --settings ./coverage.runsettings \
            --output ./.coverage/coverage.cobertura.xml \
            --output-format cobertura \
            "dotnet test --no-build -c Release ./ScrumPoker.slnx"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./.coverage/coverage.cobertura.xml
