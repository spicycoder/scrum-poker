apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: scrum-poker
  labels:
    app: scrum-poker
    component: redis
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: scrum-poker
      component: redis
  template:
    metadata:
      labels:
        app: scrum-poker
        component: redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:8.6
          command:
            - /bin/sh
          args:
            - -c
            - redis-server --requirepass $REDIS_PASSWORD
          ports:
            - name: redis
              protocol: TCP
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scrum-poker-redis-secret
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
