---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "redis-statefulset"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "redis"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Chart.Name }}"
        app.kubernetes.io/component: "redis"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
    spec:
      containers:
        - command:
            - "/bin/sh"
          image: "docker.io/library/redis:8.6"
          name: "redis"
          envFrom:
            - secretRef:
                name: "{{ .Values.secrets.existingRedisSecret | default "redis-secrets" }}"
          args:
            - "-c"
            - "redis-server --requirepass $REDIS_PASSWORD"
          ports:
            - name: "tcp"
              protocol: "TCP"
              containerPort: 6379
          imagePullPolicy: "IfNotPresent"
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Chart.Name }}"
      app.kubernetes.io/component: "redis"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {}
  updateStrategy:
    rollingUpdate: {}
    type: "RollingUpdate"
